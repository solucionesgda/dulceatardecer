{% extends 'base.html' %}{% block title %}Ingresar{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Ingresar</h1><form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Usuario o contraseña inválidos.</div>{% endif %}<div class="mb-3"><label class="form-label" for="id_username">Usuario</label><input class="form-control" type="text" name="username" autofocus required id="id_username"></div><div class="mb-3"><label class="form-label" for="id_password">Contraseña</label><input class="form-control" type="password" name="password" required id="id_password"></div><button class="btn btn-primary w-100">Ingresar</button></form></div></div></div></div>{% endblock %}
