{% extends 'base.html' %}{% block content %}<div class="d-flex flex-wrap justify-content-between gap-2 mb-3"><h1 class="h3">Personal</h1><div class="d-flex gap-2"><a class="btn btn-outline-secondary" href="{% url 'personal_exportar' 'excel' %}?{{ request.GET.urlencode }}">Exportar Excel</a><a class="btn btn-outline-secondary" href="{% url 'personal_exportar' 'pdf' %}?{{ request.GET.urlencode }}">Exportar PDF</a><a class="btn btn-primary" href="{% url 'personal_create' %}">Nuevo empleado/a</a></div></div><div class="card"><table class="table mb-0"><tr><th>Apellido y nombre</th><th>DNI</th><th>Cargo</th><th>Turno</th><th>Estado</th></tr>{% for p in object_list %}<tr><td>{{p.nombre_completo}}</td><td>{{p.dni}}</td><td>{{p.cargo}}</td><td>{{p.turno_habitual}}</td><td>{{p.estado}}</td></tr>{% endfor %}</table></div>{% endblock %}
