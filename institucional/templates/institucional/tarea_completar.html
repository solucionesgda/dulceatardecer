{% extends 'base.html' %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body"><h1 class="h3">Completar tarea</h1><p class="text-muted">{{ tarea.titulo }} · {{ tarea.fecha|date:'d/m/Y' }} · {{ tarea.get_turno_display }}</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<a class="btn btn-outline-secondary" href="{% url 'tarea_list' %}">Cancelar</a><button class="btn btn-primary">Confirmar finalización</button></form></div></div></div></div>{% endblock %}
